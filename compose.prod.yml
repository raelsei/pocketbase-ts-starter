# Prod: the image is self-contained (NO hook/migration mounts), pb_data is a named volume.
#   docker compose -f compose.prod.yml up -d --build
#
# Reverse proxy scenarios:
#   a) nginx/caddy on the host: keep the loopback port binding below and
#      point the proxy at 127.0.0.1:8090.
#   b) In-docker proxy (Traefik, Dokploy, nginx-proxy, ...): remove `ports`,
#      uncomment the `networks` block at the bottom and set the proxy's
#      network name (for Dokploy: dokploy-network). Point the domain at
#      port 8080 on the proxy/Dokploy UI side.
services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.40.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PB_HTTP_PORT:-8090}:8080"
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?PB_ENCRYPTION_KEY is required (openssl rand -hex 16)}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      PB_SUPERUSER_IPS: ${PB_SUPERUSER_IPS:-}
      # ~85% of the container memory limit below: Go GC gets aggressive before the
      # cgroup OOM killer does.
      GOMEMLIMIT: 7GiB
    volumes:
      - pb_data:/pb/pb_data
    # Docker's json-file driver is unbounded by default; a full disk means SQLite
    # cannot write and the app goes down with it.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # PocketBase needs no capabilities (non-root, port 8080) and writes only to
    # pb_data (+ /tmp for large multipart uploads). Verified incl. backups.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # PocketBase is a single process on a single SQLite writer: extra cores only
    # help reads/HTTP, never writes. 8 cores / 8G leaves room for the proxy and
    # the OS page cache (which is what makes SQLite reads fast) on a 16c/64G box.
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
    # networks:
    #   - proxy

volumes:
  pb_data:


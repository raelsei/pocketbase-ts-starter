services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.40.1
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      PB_SUPERUSER_IPS: ${PB_SUPERUSER_IPS:-}
      # Prod (dar RAM'li VPS): GC'yi agresifleştirip OOM kill'i önler
      # GOMEMLIMIT: 512MiB
    volumes:
      - ./pb_data:/pb/pb_data
      # Dev: `bun run watch` ile derlenen hook/migration'lar canlı yansır
      # (PB pb_hooks'u izler ve kendini yeniden yükler). Prod'da image
      # zaten self-contained; bu iki mount'u kaldırabilirsin.
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations

services:
  pocketbase:
    build:
      context: .
      args:
        PB_VERSION: 0.40.1
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-}
      PB_SUPERUSER_IPS: ${PB_SUPERUSER_IPS:-}
      # Prod (RAM-constrained VPS): makes GC more aggressive, prevents OOM kills
      # GOMEMLIMIT: 512MiB
    volumes:
      - ./pb_data:/pb/pb_data
      # Dev: hooks/migrations compiled by `bun run watch` are reflected live
      # (PB watches pb_hooks and reloads itself). In prod the image is
      # self-contained; these two mounts can be removed.
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
